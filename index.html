<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Snake</title>
<style>
  :root {
    --bg: #0f1020;
    --panel: #1a1c34;
    --accent: #4ade80;
    --accent-dark: #22c55e;
    --food: #f87171;
    --text: #e5e7eb;
    --muted: #9ca3af;
    --grid: #23264a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: radial-gradient(circle at 50% 0%, #1c1e3a, var(--bg));
    color: var(--text);
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    padding: 20px;
  }
  h1 {
    font-weight: 700;
    letter-spacing: 2px;
    color: var(--accent);
    text-shadow: 0 0 18px rgba(74, 222, 128, 0.4);
  }
  .scoreboard {
    display: flex;
    gap: 28px;
    background: var(--panel);
    padding: 12px 26px;
    border-radius: 14px;
    box-shadow: 0 6px 20px rgba(0, 0, 0, 0.35);
  }
  .scoreboard .label { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: 1px; }
  .scoreboard .value { font-size: 24px; font-weight: 700; }
  .wrap { position: relative; }
  canvas {
    background: var(--panel);
    border-radius: 16px;
    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
  }
  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    background: rgba(15, 16, 32, 0.82);
    border-radius: 16px;
    backdrop-filter: blur(3px);
    text-align: center;
    padding: 20px;
  }
  .overlay.hidden { display: none; }
  .overlay h2 { font-size: 28px; }
  .overlay p { color: var(--muted); max-width: 320px; line-height: 1.5; }
  button {
    background: var(--accent);
    color: #06210f;
    border: none;
    padding: 12px 28px;
    font-size: 16px;
    font-weight: 700;
    border-radius: 10px;
    cursor: pointer;
    transition: transform 0.08s ease, background 0.2s ease;
  }
  button:hover { background: var(--accent-dark); }
  button:active { transform: scale(0.96); }
  .hint { color: var(--muted); font-size: 13px; }
</style>
</head>
<body>
  <h1>SNAKE</h1>
  <div class="scoreboard">
    <div>
      <div class="label">Score</div>
      <div class="value" id="score">0</div>
    </div>
    <div>
      <div class="label">Best</div>
      <div class="value" id="best">0</div>
    </div>
  </div>

  <div class="wrap">
    <canvas id="game" width="400" height="400"></canvas>
    <div class="overlay" id="overlay">
      <h2 id="overlay-title">Ready?</h2>
      <p id="overlay-text">Use the arrow keys or WASD to move. Eat the red food to grow. Don't hit the walls or yourself!</p>
      <button id="start-btn">Play</button>
    </div>
  </div>

  <p class="hint">Arrow keys / WASD to move &middot; P to pause</p>

<script>
(function () {
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const scoreEl = document.getElementById("score");
  const bestEl = document.getElementById("best");
  const overlay = document.getElementById("overlay");
  const overlayTitle = document.getElementById("overlay-title");
  const overlayText = document.getElementById("overlay-text");
  const startBtn = document.getElementById("start-btn");

  const GRID = 20;                       // 20x20 cells
  const CELL = canvas.width / GRID;       // pixel size per cell
  const START_SPEED = 8;                  // moves per second at start
  const MAX_SPEED = 18;

  let snake, dir, nextDir, food, score, best, speed, running, paused, acc, last;

  best = Number(localStorage.getItem("snake-best") || 0);
  bestEl.textContent = best;

  function reset() {
    snake = [{ x: 10, y: 10 }, { x: 9, y: 10 }, { x: 8, y: 10 }];
    dir = { x: 1, y: 0 };
    nextDir = { x: 1, y: 0 };
    score = 0;
    speed = START_SPEED;
    placeFood();
    scoreEl.textContent = score;
  }

  function placeFood() {
    while (true) {
      const p = {
        x: Math.floor(Math.random() * GRID),
        y: Math.floor(Math.random() * GRID),
      };
      if (!snake.some(s => s.x === p.x && s.y === p.y)) { food = p; return; }
    }
  }

  function step() {
    dir = nextDir;
    const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

    // wall or self collision
    if (
      head.x < 0 || head.x >= GRID || head.y < 0 || head.y >= GRID ||
      snake.some(s => s.x === head.x && s.y === head.y)
    ) {
      gameOver();
      return;
    }

    snake.unshift(head);

    if (head.x === food.x && head.y === food.y) {
      score += 10;
      scoreEl.textContent = score;
      speed = Math.min(MAX_SPEED, START_SPEED + Math.floor(score / 50));
      placeFood();
    } else {
      snake.pop();
    }
  }

  function draw() {
    // background grid
    ctx.fillStyle = getVar("--panel");
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.strokeStyle = getVar("--grid");
    ctx.lineWidth = 1;
    for (let i = 1; i < GRID; i++) {
      ctx.beginPath(); ctx.moveTo(i * CELL, 0); ctx.lineTo(i * CELL, canvas.height); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, i * CELL); ctx.lineTo(canvas.width, i * CELL); ctx.stroke();
    }

    // food
    drawCell(food.x, food.y, getVar("--food"), true);

    // snake
    snake.forEach((s, i) => {
      const shade = i === 0 ? getVar("--accent") : getVar("--accent-dark");
      drawCell(s.x, s.y, shade, false);
    });
  }

  function drawCell(x, y, color, round) {
    const pad = 2;
    ctx.fillStyle = color;
    const r = round ? CELL / 2 : 5;
    roundRect(x * CELL + pad, y * CELL + pad, CELL - pad * 2, CELL - pad * 2, r);
    ctx.fill();
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function getVar(name) {
    return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  }

  function loop(ts) {
    if (!running) return;
    if (!last) last = ts;
    const delta = (ts - last) / 1000;
    last = ts;

    if (!paused) {
      acc += delta;
      const interval = 1 / speed;
      while (acc >= interval) {
        step();
        acc -= interval;
        if (!running) break;
      }
      draw();
    }
    requestAnimationFrame(loop);
  }

  function startGame() {
    reset();
    running = true;
    paused = false;
    acc = 0;
    last = 0;
    overlay.classList.add("hidden");
    requestAnimationFrame(loop);
  }

  function gameOver() {
    running = false;
    if (score > best) {
      best = score;
      localStorage.setItem("snake-best", best);
      bestEl.textContent = best;
    }
    overlayTitle.textContent = "Game Over";
    overlayText.textContent = "You scored " + score + " points. " +
      (score >= best && score > 0 ? "New best! " : "") + "Press Play to try again.";
    startBtn.textContent = "Play Again";
    overlay.classList.remove("hidden");
  }

  function togglePause() {
    if (!running) return;
    paused = !paused;
    if (paused) {
      overlayTitle.textContent = "Paused";
      overlayText.textContent = "Press P or click Resume to continue.";
      startBtn.textContent = "Resume";
      overlay.classList.remove("hidden");
    } else {
      overlay.classList.add("hidden");
      last = 0;
    }
  }

  const KEYS = {
    ArrowUp: { x: 0, y: -1 }, ArrowDown: { x: 0, y: 1 },
    ArrowLeft: { x: -1, y: 0 }, ArrowRight: { x: 1, y: 0 },
    w: { x: 0, y: -1 }, s: { x: 0, y: 1 },
    a: { x: -1, y: 0 }, d: { x: 1, y: 0 },
  };

  document.addEventListener("keydown", (e) => {
    const key = e.key.length === 1 ? e.key.toLowerCase() : e.key;
    if (key === "p") { togglePause(); return; }
    const nd = KEYS[key];
    if (!nd) return;
    e.preventDefault();
    // prevent reversing directly into itself
    if (nd.x === -dir.x && nd.y === -dir.y) return;
    nextDir = nd;
  });

  startBtn.addEventListener("click", () => {
    if (paused) { togglePause(); } else { startGame(); }
  });

  // initial idle render
  reset();
  draw();
})();
</script>
</body>
</html>
